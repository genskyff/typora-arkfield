name: CI

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Mise
        uses: jdx/mise-action@v4

      - name: Debug dart-sass
        run: |
          D="$(mise where aqua:sass/dart-sass)/dart-sass"
          ls -la "$D" "$D/src"
          file "$D/src/dart"

      - name: Run check
        run: mise run check

      - name: Verify generated theme
        run: |
          mise run build
          git diff --exit-code -- theme
